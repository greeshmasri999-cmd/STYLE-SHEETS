<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #19c6a1;
            color: #376d58;
        }

        /* Header */
        header {
            background-color: #908b8b;
            color: rgb(157, 46, 79);
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        header h1 {
            font-size: 46px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 32px;
        }

        nav a {
            color: rgb(136, 64, 179);
            text-decoration: none;
            font-size: 22px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main Section */
        main {
            min-height: 240px;
            padding: 40px;
            display: flex;
            gap: 26px;
            align-items: flex-start;
        }

        /* Cards */
        .card {
            background-color: rgb(52, 203, 26);
            border: 1px solid #db1515;
            border-radius: 6px;
            padding: 30px 27px;
            box-shadow: 0 2px 5px rgba(153, 199, 230, 0.15);
            flex: 1;
            min-height: 125px;
        }

        .card h2 {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 22px;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            background-color: #3610b1;
            color: rgb(181, 222, 19);
            height: 105px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        footer a {
            color: #eea7e2;
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 800px) {

            header {
                height: auto;
                padding: 30px;
                flex-direction: column;
                gap: 25px;
                text-align: center;
            }

            header h1 {
                font-size: 36px;
            }

            nav {
                gap: 20px;
            }

            nav a {
                font-size: 18px;
            }

            main {
                flex-direction: column;
            }

            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>CHOKKAM GREESHMA SRI</h1>

        <nav>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <!-- About -->
        <div class="card" id="about">
            <h2>About Me:</h2>
            <p>
                studying in KL UNIVERSITY in CSE branch<br>
                in vadeshwaram campus
            </p>
        </div>


        <!-- Projects -->
        <div class="card" id="projects">
            <h2>Projects:</h2>
            <p>
                Project 1, Project 2...
            </p>
        </div>


        <!-- Skills -->
        <div class="card" id="skills">
            <h2>Skills: HTML, CSS, JavaScript...</h2>
        </div>

    </main>


    <!-- Footer -->
    <footer id="contact">
        <p>
            Contact: greeshmasri999@gmail.com |
            Follow me on
            <a href="#">LinkedIn</a>
        </p>
    </footer>

</body>
</html>
