<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex_flow_layout</title>
    <style>
        .container{
            display:flex;
            flex-direction: row;
            gap: 20px;
            justify-content: center;
        }
        .box{
            width: 200px;
            height: 200px;
            border: 2px black;
        }
        .box img{
            width: 100%;
            height: 100%;
           object-fit: cover;
        }
    </style>
</head>
<body>
    <h2> lotus gallery - flex row layout</h2>
    <div class="container">
        <div class="box"><img src="lotus.jpg" alt="pink lotus"></div>
        <div class="box"><img src="lotus.jpg" alt="pink lotu"></div>
        <div class="box"><img src="lotus.jpg" alt="pink lotu"></div>
        <div class="box"><img src="lotus.jpg" alt="pink lotu"></div>
        <div class="box"><img src="lotus.jpg" alt="pink lotu"></div>
    </div>
</body>
</html>
